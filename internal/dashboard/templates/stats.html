<div class="stats-partial">
	<div class="stat-card">
		<div class="stat-label">Total Requests</div>
		<div class="stat-value blue">{{.TotalRequests}}</div>
	</div>
	<div class="stat-card">
		<div class="stat-label">Active Proxies</div>
		<div class="stat-value green">{{.ActiveRemotes}}</div>
	</div>
	<div class="stat-card">
		<div class="stat-label">Total Proxies</div>
		<div class="stat-value mauve">{{.TotalRemotes}}</div>
	</div>
	<div class="stat-card">
		<div class="stat-label">Total Errors</div>
		<div class="stat-value {{if gt .TotalErrors 0}}red{{else}}green{{end}}">{{.TotalErrors}}</div>
	</div>
	<div class="stat-card">
		<div class="stat-label">Data Sent</div>
		<div class="stat-value">{{formatBytes .TotalBytesSent}}</div>
	</div>
	<div class="stat-card">
		<div class="stat-label">Data Received</div>
		<div class="stat-value">{{formatBytes .TotalBytesRecv}}</div>
	</div>
</div>
