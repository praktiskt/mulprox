<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mulprox Dashboard</title>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		:root {
			--base: #1e1e2e;
			--surface0: #313244;
			--surface1: #45475a;
			--surface2: #585b70;
			--text: #cdd6f4;
			--subtext1: #bac2de;
			--subtext0: #a6adc8;
			--overlay0: #6c7086;
			--overlay1: #7f849c;
			--overlay2: #9399b2;
			--blue: #89b4fa;
			--lavender: #b4befe;
			--peach: #fab387;
			--green: #a6e3a1;
			--yellow: #f9e2af;
			--red: #f38ba8;
			--mauve: #cba6f7;
			--teal: #94e2d5;
			--sky: #89dceb;
			--sapphire: #74c7ec;
		}
		
		* { box-sizing: border-box; margin: 0; padding: 0; }
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--base);
			color: var(--text);
			line-height: 1.6;
			min-height: 100vh;
		}
		
		.container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}
		
		h1 {
			color: var(--lavender);
			margin-bottom: 8px;
			font-weight: 600;
			font-family: monospace;
			text-transform: lowercase;
		}
		
		h2 {
			color: var(--blue);
			font-size: 1.2rem;
			margin-bottom: 12px;
			font-weight: 500;
		}
		
		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 24px;
		}
		
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
			margin-bottom: 32px;
		}
		
		.stat-card {
			background: var(--surface0);
			border-radius: 8px;
			padding: 16px;
			border: 1px solid var(--surface1);
			display: flex;
			flex-direction: column;
			gap: 6px;
			text-align: center;
		}

		.stat-card .stat-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: auto;
		}

		.stat-card .sparkline-container {
			margin: 0 auto;
			width: 100%;
			height: 40px;
		}

		.stat-card .sparkline-container canvas {
			width: 100% !important;
			height: 40px !important;
		}
		
		.stat-label {
			color: var(--subtext1);
			font-size: 0.8rem;
		}
		
		.stat-value {
			color: var(--text);
			font-size: 1.5rem;
			font-weight: 600;
		}
		
		.stat-value.green { color: var(--green); }
		.stat-value.yellow { color: var(--yellow); }
		.stat-value.red { color: var(--red); }
		.stat-value.blue { color: var(--blue); }
		.stat-value.mauve { color: var(--mauve); }
		.stat-value.peach { color: var(--peach); }
		.stat-value.teal { color: var(--teal); }


		
		.search-box {
			background: var(--surface0);
			border: 1px solid var(--surface1);
			border-radius: 8px;
			padding: 12px 16px;
			color: var(--text);
			font-size: 1rem;
			width: 100%;
			margin-bottom: 20px;
		}
		
		.search-box:focus {
			outline: none;
			border-color: var(--blue);
		}
		
		.search-box::placeholder {
			color: var(--overlay0);
		}
		
		.table-container {
			background: var(--surface0);
			border-radius: 12px;
			overflow: auto;
			border: 1px solid var(--surface1);
		}
		
		table {
			width: 100%;
			border-collapse: collapse;
		}
		
		th {
			background: var(--surface1);
			color: var(--subtext1);
			font-weight: 500;
			text-align: left;
			padding: 12px 16px;
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		
		td {
			padding: 12px 16px;
			border-bottom: 1px solid var(--surface1);
			color: var(--text);
		}
		
		tr:last-child td {
			border-bottom: none;
		}
		
		tr:hover td {
			background: var(--surface1);
		}
		
		.status-badge {
			display: inline-block;
			padding: 4px 10px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: 500;
		}
		
		.status-online {
			background: rgba(166, 227, 161, 0.15);
			color: var(--green);
		}
		
		.status-offline {
			background: rgba(243, 139, 168, 0.15);
			color: var(--red);
		}
		
		.ip {
			font-family: 'Monaco', 'Menlo', monospace;
			font-size: 0.9rem;
			color: var(--subtext0);
		}

		.sort-link {
			color: var(--subtext1);
			text-decoration: none;
			cursor: pointer;
		}

		.sort-link:hover {
			color: var(--blue);
		}

		.showing-used {
			text-align: center;
			padding: 12px;
			color: var(--overlay0);
			font-size: 0.85rem;
			background: var(--surface1);
		}
		
		.latency {
			font-family: 'Monaco', 'Menlo', monospace;
		}
		
		.latency-good { color: var(--green); }
		.latency-ok { color: var(--yellow); }
		.latency-bad { color: var(--red); }
		
		.loading {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.empty {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.stats-partial {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			gap: 16px;
			margin-bottom: 24px;
		}

		@media (max-width: 1150px) {
			.stats-partial {
				grid-template-columns: repeat(3, 1fr);
			}
		}

		@media (max-width: 500px) {
			.stats-partial {
				grid-template-columns: repeat(2, 1fr);
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<h1>mulprox dashboard</h1>
		</div>

		<div id="stats-grid" hx-get="/dashboard/stats" hx-trigger="load" hx-swap="innerHTML">
			<div class="loading">Loading stats...</div>
		</div>

		<input
			type="text"
			class="search-box"
			placeholder="Search by hostname, country, city, IP..."
			name="q"
		>
		
		<div id="proxies-table" hx-get="/dashboard/proxies" hx-trigger="load" hx-swap="innerHTML">
			<div class="loading">Loading proxies...</div>
		</div>
	</div>

	<script>
		let sortState = { field: 'hostname', dir: 'asc' };

		const HISTORY_LENGTH = 60;
		const history = {
			requests: { values: [], prev: 0, chart: null, isRate: true },
			active: { values: [], prev: 0, chart: null, isRate: false },
			total: { values: [], prev: 0, chart: null, isRate: false },
			errors: { values: [], prev: 0, chart: null, isRate: false },
			sent: { values: [], prev: 0, chart: null, isRate: true },
			recv: { values: [], prev: 0, chart: null, isRate: true },
		};

		const chartColors = {
			blue: '#89b4fa',
			green: '#a6e3a1',
			mauve: '#cba6f7',
			red: '#f38ba8',
			peach: '#fab387',
			teal: '#94e2d5',
			text: '#cdd6f4',
		};

		function destroyCharts() {
			Object.keys(history).forEach(key => {
				if (history[key].chart) {
					history[key].chart.destroy();
					history[key].chart = null;
				}
			});
		}

		function initCharts() {
			destroyCharts();
			Object.keys(history).forEach(key => {
				const canvas = document.getElementById('chart-' + key);
				if (!canvas) return;
				const ctx = canvas.getContext('2d');
				let color = chartColors.blue;
				if (key === 'active') color = chartColors.green;
				if (key === 'total') color = chartColors.mauve;
				if (key === 'errors') color = chartColors.red;
				if (key === 'sent') color = chartColors.peach;
				if (key === 'recv') color = chartColors.teal;

				history[key].chart = new Chart(ctx, {
					type: 'line',
					data: {
						labels: Array(HISTORY_LENGTH).fill(''),
						datasets: [{
							data: [],
							borderColor: color,
							backgroundColor: color + '33',
							fill: true,
							tension: 0.3,
							pointRadius: 0,
							hoverPointRadius: 4,
							hoverPointBackgroundColor: color,
							borderWidth: 2,
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						plugins: { 
							legend: { display: false },
							tooltip: { 
								enabled: true,
								mode: 'index',
								intersect: false,
							}
						},
						scales: {
							x: { display: false },
							y: {
								display: false,
								beginAtZero: true,
								suggestedMin: 0,
								grace: '50%',
							}
						},
						animation: { duration: 0 },
						interaction: {
							mode: 'nearest',
							axis: 'x',
							intersect: false
						}
					}
				});
			});
		}



		function formatRate(bytes) {
			if (bytes < 1024) return bytes + ' B/s';
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB/s';
			if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(0) + ' MB/s';
			return (bytes / 1024 / 1024 / 1024).toFixed(0) + ' GB/s';
		}

		function updateCharts() {
			Object.keys(history).forEach(key => {
				const el = document.querySelector(`[data-rate="${key}"]`);
				if (!el) return;

				const current = parseFloat(el.dataset.raw);
				if (isNaN(current)) return;

				const h = history[key];
				let val;

				if (h.prev === 0) {
					val = 0;
				} else if (h.isRate) {
					val = Math.max(0, current - h.prev);
				} else {
					val = current;
				}
				h.prev = current;
				h.values.push(val);

				if (h.values.length > HISTORY_LENGTH) h.values.shift();

				if (h.chart) {
					h.chart.data.datasets[0].data = h.values;
					h.chart.update('none');
				}

				if (key === 'sent' || key === 'recv') {
					el.textContent = formatRate(val);
				} else if (key === 'requests') {
					el.textContent = Math.round(val) + '/s';
				} else {
					el.textContent = String(Math.round(val));
				}
			});
		}

		function refreshProxies() {
			const table = document.getElementById('proxies-table');
			const searchBox = document.querySelector('.search-box');
			const query = searchBox ? searchBox.value : '';

			const params = new URLSearchParams();
			if (query) params.set('q', query);
			if (sortState.field) {
				params.set('sort', sortState.field);
				params.set('dir', sortState.dir);
			}

			const url = '/dashboard/proxies?' + params.toString();
			fetch(url).then(r => r.text()).then(html => {
				const doc = new DOMParser().parseFromString(html, 'text/html');
				const newTbody = doc.querySelector('tbody');
				const oldTbody = table.querySelector('tbody');
				if (newTbody && oldTbody) {
					oldTbody.replaceWith(newTbody);
				} else if (!oldTbody) {
					table.innerHTML = html;
				}
			});
		}
		
		function refreshStats() {
			const stats = document.getElementById('stats-grid');
			fetch('/dashboard/stats').then(r => r.text()).then(html => {
				stats.innerHTML = html;
				initCharts();
				updateCharts();
			});
		}
		
		refreshStats();
		refreshProxies();
		setInterval(refreshStats, 1000);
		setInterval(refreshProxies, 1000);
		
		document.body.addEventListener('click', function(e) {
			const link = e.target.closest('.sort-link');
			if (link) {
				e.preventDefault();
				const sortField = link.dataset.sort;
				
				if (sortState.field === sortField) {
					sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
				} else {
					sortState.field = sortField;
					sortState.dir = 'desc';
				}
				
				refreshProxies();
			}
		});

		const searchBox = document.querySelector('.search-box');
		if (searchBox) {
			let debounceTimer;
			searchBox.addEventListener('input', function(e) {
				clearTimeout(debounceTimer);
				debounceTimer = setTimeout(refreshProxies, 300);
			});
		}
	</script>
</body>
</html>
