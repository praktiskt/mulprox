<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mulprox Dashboard</title>
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
	<style>
		:root {
			--base: #1e1e2e;
			--surface0: #313244;
			--surface1: #45475a;
			--surface2: #585b70;
			--text: #cdd6f4;
			--subtext1: #bac2de;
			--subtext0: #a6adc8;
			--overlay0: #6c7086;
			--overlay1: #7f849c;
			--overlay2: #9399b2;
			--blue: #89b4fa;
			--lavender: #b4befe;
			--peach: #fab387;
			--green: #a6e3a1;
			--yellow: #f9e2af;
			--red: #f38ba8;
			--mauve: #cba6f7;
			--teal: #94e2d5;
			--sky: #89dceb;
			--sapphire: #74c7ec;
		}
		
		* { box-sizing: border-box; margin: 0; padding: 0; }
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--base);
			color: var(--text);
			line-height: 1.6;
			min-height: 100vh;
		}
		
		.container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}
		
		h1 {
			color: var(--lavender);
			margin-bottom: 8px;
			font-weight: 600;
			font-family: monospace;
			text-transform: lowercase;
		}
		
		h2 {
			color: var(--blue);
			font-size: 1.2rem;
			margin-bottom: 12px;
			font-weight: 500;
		}
		
		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 24px;
		}
		
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
			margin-bottom: 32px;
		}
		
		.stat-card {
			background: var(--surface0);
			border-radius: 8px;
			padding: 16px;
			border: 1px solid var(--surface1);
			display: flex;
			flex-direction: column;
			gap: 6px;
			text-align: center;
		}

		.stat-card .stat-row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: auto;
		}

		.stat-card .sparkline-container {
			margin: 0 auto;
			width: 100%;
			height: 40px;
		}

		.stat-card .sparkline-container canvas {
			width: 100% !important;
			height: 40px !important;
		}
		
		.stat-label {
			color: var(--subtext1);
			font-size: 0.8rem;
		}
		
		.stat-value {
			color: var(--text);
			font-size: 1.5rem;
			font-weight: 600;
		}
		
		.stat-value.green { color: var(--green); }
		.stat-value.yellow { color: var(--yellow); }
		.stat-value.red { color: var(--red); }
		.stat-value.blue { color: var(--blue); }
		.stat-value.mauve { color: var(--mauve); }
		.stat-value.peach { color: var(--peach); }
		.stat-value.teal { color: var(--teal); }


		
		.search-box {
			background: var(--surface0);
			border: 1px solid var(--surface1);
			border-radius: 8px;
			padding: 12px 16px;
			color: var(--text);
			font-size: 1rem;
			width: 100%;
			margin-bottom: 20px;
		}
		
		.search-box:focus {
			outline: none;
			border-color: var(--blue);
		}
		
		.search-box::placeholder {
			color: var(--overlay0);
		}
		
		.table-container {
			background: var(--surface0);
			border-radius: 12px;
			overflow: auto;
			border: 1px solid var(--surface1);
		}
		
		table {
			width: 100%;
			border-collapse: collapse;
		}
		
		th {
			background: var(--surface1);
			color: var(--subtext1);
			font-weight: 500;
			text-align: left;
			padding: 12px 16px;
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		
		td {
			padding: 12px 16px;
			border-bottom: 1px solid var(--surface1);
			color: var(--text);
		}
		
		tr:last-child td {
			border-bottom: none;
		}
		
		tr:hover td {
			background: var(--surface1);
		}
		
		.status-badge {
			display: inline-block;
			padding: 4px 10px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: 500;
		}
		
		.status-online {
			background: rgba(166, 227, 161, 0.15);
			color: var(--green);
		}
		
		.status-offline {
			background: rgba(243, 139, 168, 0.15);
			color: var(--red);
		}
		
		.ip {
			font-family: 'Monaco', 'Menlo', monospace;
			font-size: 0.9rem;
			color: var(--subtext0);
		}

		.sort-link {
			color: var(--subtext1);
			text-decoration: none;
			cursor: pointer;
		}

		.sort-link:hover {
			color: var(--blue);
		}

		.showing-used {
			text-align: center;
			padding: 12px;
			color: var(--overlay0);
			font-size: 0.85rem;
			background: var(--surface1);
		}
		
		.latency {
			font-family: 'Monaco', 'Menlo', monospace;
		}
		
		.latency-good { color: var(--green); }
		.latency-ok { color: var(--yellow); }
		.latency-bad { color: var(--red); }
		
		.loading {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.empty {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.stats-partial {
			display: grid;
			grid-template-columns: repeat(6, 1fr);
			gap: 16px;
			margin-bottom: 24px;
		}

		@media (max-width: 1150px) {
			.stats-partial {
				grid-template-columns: repeat(3, 1fr);
			}
		}

		@media (max-width: 500px) {
			.stats-partial {
				grid-template-columns: repeat(2, 1fr);
			}
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<h1>mulprox dashboard</h1>
		</div>

		<div id="stats-grid">
			<div class="stats-partial">
				<div class="stat-card">
					<div class="stat-label">Requests</div>
					<div class="stat-value blue" data-rate="requests">0/s</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-requests"></canvas></div></div>
				</div>
				<div class="stat-card">
					<div class="stat-label">Active Proxies</div>
					<div class="stat-value green" data-rate="active">0</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-active"></canvas></div></div>
				</div>
				<div class="stat-card">
					<div class="stat-label">Total Proxies</div>
					<div class="stat-value mauve" data-rate="total">0</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-total"></canvas></div></div>
				</div>
				<div class="stat-card">
					<div class="stat-label">Errors</div>
					<div class="stat-value red" data-rate="errors">0/s</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-errors"></canvas></div></div>
				</div>
				<div class="stat-card">
					<div class="stat-label">Data Sent</div>
					<div class="stat-value peach" data-rate="sent">0 B/s</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-sent"></canvas></div></div>
				</div>
				<div class="stat-card">
					<div class="stat-label">Data Received</div>
					<div class="stat-value teal" data-rate="recv">0 B/s</div>
					<div class="stat-row"><div class="sparkline-container"><canvas id="chart-recv"></canvas></div></div>
				</div>
			</div>
		</div>

		<input
			type="text"
			class="search-box"
			placeholder="Search by hostname, country, city, IP..."
			name="q"
		>
		
		<div id="proxies-table">
			<div class="table-container">
				<table>
					<thead>
						<tr>
							<th><a href="#" class="sort-link" data-sort="hostname">Hostname</a></th>
							<th><a href="#" class="sort-link" data-sort="country">Country</a></th>
							<th><a href="#" class="sort-link" data-sort="city">City</a></th>
							<th><a href="#" class="sort-link" data-sort="egress_ip">Egress IP</a></th>
							<th><a href="#" class="sort-link" data-sort="status">Status</a></th>
							<th><a href="#" class="sort-link" data-sort="latency">Latency</a></th>
							<th><a href="#" class="sort-link" data-sort="requests">Requests</a></th>
							<th><a href="#" class="sort-link" data-sort="errors">Errors</a></th>
							<th><a href="#" class="sort-link" data-sort="last_used">Last Used</a></th>
						</tr>
					</thead>
					<tbody id="proxies-tbody">
						<tr><td colspan="9" class="loading">Loading proxies...</td></tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script>
		let sortState = { field: 'hostname', dir: 'asc' };
		let proxyData = [];

		const statConfig = {
			requests:     { key: 'requests',     color: '#89b4fa', isRate: true },
			active:       { key: 'active_remotes', color: '#a6e3a1', isRate: false },
			total:        { key: 'total_remotes',  color: '#cba6f7', isRate: false },
			errors:       { key: 'errors',        color: '#f38ba8', isRate: true },
			sent:         { key: 'bytes_sent',    color: '#fab387', isRate: true },
			recv:         { key: 'bytes_recv',    color: '#94e2d5', isRate: true },
		};

		const stats = {};
		Object.keys(statConfig).forEach(key => {
			stats[key] = { chart: null };
		});

		const chartLabels = Array(120).fill('');

		function initCharts() {
			Object.keys(statConfig).forEach(key => {
				const canvas = document.getElementById('chart-' + key);
				if (!canvas) return;
				const ctx = canvas.getContext('2d');
				const cfg = statConfig[key];

				stats[key].chart = new Chart(ctx, {
					type: 'line',
					data: {
						labels: chartLabels,
						datasets: [{
							data: [],
							borderColor: cfg.color,
							backgroundColor: cfg.color + '33',
							fill: true,
							tension: 0.3,
							pointRadius: 0,
							borderWidth: 2,
						}]
					},
					options: {
						responsive: true,
						maintainAspectRatio: false,
						plugins: { legend: { display: false } },
						scales: {
							x: { display: false },
							y: { display: false, beginAtZero: true },
						},
						animation: { duration: 0 },
					}
				});
			});
		}

		function formatRateValue(val) {
			if (val === 0) return 0;
			if (val < 1) return val.toFixed(2);
			if (val < 10) return val.toFixed(1);
			return Math.round(val);
		}

		function formatRate(bytes) {
			if (bytes < 1024) return bytes + ' B/s';
			if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB/s';
			if (bytes < 1024 * 1024 * 1024) {
				const mb = bytes / 1024 / 1024;
				return mb < 10 ? mb.toFixed(1) + ' MB/s' : mb.toFixed(0) + ' MB/s';
			}
			return (bytes / 1024 / 1024 / 1024).toFixed(0) + ' GB/s';
		}

		function updateCharts(windowData) {
			if (!windowData || windowData.length === 0) return;

			const lastStat = windowData[windowData.length - 1];

			Object.keys(statConfig).forEach(key => {
				const cfg = statConfig[key];
				const el = document.querySelector(`[data-rate="${key}"]`);
				const val = lastStat[cfg.key];

				if (el) {
					if (cfg.isRate && key !== 'sent' && key !== 'recv') {
						el.textContent = formatRateValue(val) + '/s';
					} else if (key === 'sent' || key === 'recv') {
						el.textContent = formatRate(val);
					} else {
						el.textContent = String(Math.round(val));
					}
				}

				const data = windowData.map(w => w[cfg.key]);
				if (stats[key].chart) {
					stats[key].chart.data.datasets[0].data = data;
					stats[key].chart.update('none');
				}
			});
		}

		function formatProxyTime(t) {
			if (!t || t.startsWith('0001-')) return '-';
			return new Date(t).toLocaleTimeString('en-GB', { hour12: false });
		}

		function latencyClass(ms) {
			if (ms < 0) return '';
			if (ms < 100) return 'latency-good';
			if (ms < 300) return 'latency-ok';
			return 'latency-bad';
		}

		function esc(s) {
			return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
		}

		function renderProxiesTable() {
			const tbody = document.getElementById('proxies-tbody');
			const query = (document.querySelector('.search-box')?.value || '').toLowerCase();

			let filtered = proxyData;
			if (query) {
				filtered = proxyData.filter(p =>
					p.hostname.toLowerCase().includes(query) ||
					p.country.toLowerCase().includes(query) ||
					p.city.toLowerCase().includes(query) ||
					p.egress_ip.toLowerCase().includes(query)
				);
			}

			const f = sortState.field, d = sortState.dir;
			filtered.sort((a, b) => {
				let cmp = 0;
				switch (f) {
					case 'hostname': cmp = a.hostname.localeCompare(b.hostname); break;
					case 'country':  cmp = a.country.localeCompare(b.country); break;
					case 'city':     cmp = a.city.localeCompare(b.city); break;
					case 'egress_ip':cmp = a.egress_ip.localeCompare(b.egress_ip); break;
					case 'status':
						cmp = (a.online === b.online) ? 0 : a.online ? -1 : 1;
						break;
					case 'latency': {
						const aOk = a.online && a.ping_mean > 0;
						const bOk = b.online && b.ping_mean > 0;
						if (aOk !== bOk) { cmp = aOk ? -1 : 1; break; }
						cmp = a.ping_mean - b.ping_mean;
						break;
					}
					case 'requests': cmp = a.request_count - b.request_count; break;
					case 'errors':   cmp = a.error_count - b.error_count; break;
					case 'last_used':
						cmp = new Date(a.last_used) - new Date(b.last_used);
						break;
				}
				if (cmp === 0) cmp = a.hostname.localeCompare(b.hostname);
				return d === 'asc' ? cmp : -cmp;
			});

			if (filtered.length === 0) {
				tbody.innerHTML = '<tr><td colspan="9" class="empty">No proxies found</td></tr>';
				return;
			}

			tbody.innerHTML = filtered.map(p => {
				const statusClass = p.online ? 'status-online' : 'status-offline';
				const statusText = p.online ? 'Online' : 'Offline';
				const latClass = latencyClass(p.ping_mean);
				const latText = p.online && p.ping_mean > 0 ? Math.round(p.ping_mean) + 'ms' : '\u2014';
				const errStyle = p.error_count > 0 ? ' style="color: var(--red)"' : '';
				return `<tr>
					<td>${esc(p.hostname)}</td>
					<td>${esc(p.country)}</td>
					<td>${esc(p.city)}</td>
					<td class="ip">${esc(p.egress_ip)}</td>
					<td><span class="status-badge ${statusClass}">${statusText}</span></td>
					<td class="latency ${latClass}">${latText}</td>
					<td>${p.request_count}</td>
					<td${errStyle}>${p.error_count}</td>
					<td>${formatProxyTime(p.last_used)}</td>
				</tr>`;
			}).join('');

			document.querySelectorAll('.sort-link').forEach(link => {
				const field = link.dataset.sort;
				const text = link.textContent.replace(/[ ▲▼]$/, '').trim();
				if (field === sortState.field) {
					link.textContent = text + (sortState.dir === 'asc' ? ' ▲' : ' ▼');
				} else {
					link.textContent = text;
				}
			});
		}

		initCharts();

		const evtSource = new EventSource('/dashboard/stream');
		evtSource.addEventListener('stats', function(e) {
			updateCharts(JSON.parse(e.data).window);
		});
		evtSource.addEventListener('proxies', function(e) {
			proxyData = JSON.parse(e.data);
			renderProxiesTable();
		});

		document.body.addEventListener('click', function(e) {
			const link = e.target.closest('.sort-link');
			if (link) {
				e.preventDefault();
				const field = link.dataset.sort;
				if (sortState.field === field) {
					sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
				} else {
					sortState.field = field;
					sortState.dir = 'desc';
				}
				renderProxiesTable();
			}
		});

		const searchBox = document.querySelector('.search-box');
		if (searchBox) {
			let debounceTimer;
			searchBox.addEventListener('input', function() {
				clearTimeout(debounceTimer);
				debounceTimer = setTimeout(renderProxiesTable, 300);
			});
		}
	</script>
</body>
</html>
