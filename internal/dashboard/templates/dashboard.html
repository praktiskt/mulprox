<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mulprox Dashboard</title>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<style>
		:root {
			--base: #1e1e2e;
			--surface0: #313244;
			--surface1: #45475a;
			--surface2: #585b70;
			--text: #cdd6f4;
			--subtext1: #bac2de;
			--subtext0: #a6adc8;
			--overlay0: #6c7086;
			--overlay1: #7f849c;
			--overlay2: #9399b2;
			--blue: #89b4fa;
			--lavender: #b4befe;
			--peach: #fab387;
			--green: #a6e3a1;
			--yellow: #f9e2af;
			--red: #f38ba8;
			--mauve: #cba6f7;
			--teal: #94e2d5;
			--sky: #89dceb;
			--sapphire: #74c7ec;
		}
		
		* { box-sizing: border-box; margin: 0; padding: 0; }
		
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: var(--base);
			color: var(--text);
			line-height: 1.6;
			min-height: 100vh;
		}
		
		.container {
			max-width: 1400px;
			margin: 0 auto;
			padding: 20px;
		}
		
		h1 {
			color: var(--lavender);
			margin-bottom: 8px;
			font-weight: 600;
		}
		
		h2 {
			color: var(--blue);
			font-size: 1.2rem;
			margin-bottom: 12px;
			font-weight: 500;
		}
		
		.header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 24px;
		}
		
		.subtitle {
			color: var(--subtext0);
			font-size: 0.9rem;
		}
		
		.stats-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
			margin-bottom: 32px;
		}
		
		.stat-card {
			background: var(--surface0);
			border-radius: 12px;
			padding: 20px;
			border: 1px solid var(--surface1);
		}
		
		.stat-label {
			color: var(--subtext1);
			font-size: 0.85rem;
			margin-bottom: 4px;
		}
		
		.stat-value {
			color: var(--text);
			font-size: 1.8rem;
			font-weight: 600;
		}
		
		.stat-value.green { color: var(--green); }
		.stat-value.yellow { color: var(--yellow); }
		.stat-value.red { color: var(--red); }
		.stat-value.blue { color: var(--blue); }
		.stat-value.mauve { color: var(--mauve); }
		
		.search-box {
			background: var(--surface0);
			border: 1px solid var(--surface1);
			border-radius: 8px;
			padding: 12px 16px;
			color: var(--text);
			font-size: 1rem;
			width: 100%;
			margin-bottom: 20px;
		}
		
		.search-box:focus {
			outline: none;
			border-color: var(--blue);
		}
		
		.search-box::placeholder {
			color: var(--overlay0);
		}
		
		.table-container {
			background: var(--surface0);
			border-radius: 12px;
			overflow: hidden;
			border: 1px solid var(--surface1);
		}
		
		table {
			width: 100%;
			border-collapse: collapse;
		}
		
		th {
			background: var(--surface1);
			color: var(--subtext1);
			font-weight: 500;
			text-align: left;
			padding: 12px 16px;
			font-size: 0.85rem;
			text-transform: uppercase;
			letter-spacing: 0.5px;
		}
		
		td {
			padding: 12px 16px;
			border-bottom: 1px solid var(--surface1);
			color: var(--text);
		}
		
		tr:last-child td {
			border-bottom: none;
		}
		
		tr:hover td {
			background: var(--surface1);
		}
		
		.status-badge {
			display: inline-block;
			padding: 4px 10px;
			border-radius: 20px;
			font-size: 0.75rem;
			font-weight: 500;
		}
		
		.status-online {
			background: rgba(166, 227, 161, 0.15);
			color: var(--green);
		}
		
		.status-offline {
			background: rgba(243, 139, 168, 0.15);
			color: var(--red);
		}
		
		.ip {
			font-family: 'Monaco', 'Menlo', monospace;
			font-size: 0.9rem;
			color: var(--subtext0);
		}

		.sort-link {
			color: var(--subtext1);
			text-decoration: none;
			cursor: pointer;
		}

		.sort-link:hover {
			color: var(--blue);
		}

		.showing-used {
			text-align: center;
			padding: 12px;
			color: var(--overlay0);
			font-size: 0.85rem;
			background: var(--surface1);
		}
		
		.latency {
			font-family: 'Monaco', 'Menlo', monospace;
		}
		
		.latency-good { color: var(--green); }
		.latency-ok { color: var(--yellow); }
		.latency-bad { color: var(--red); }
		
		.loading {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.empty {
			text-align: center;
			padding: 40px;
			color: var(--overlay0);
		}
		
		.refresh-btn {
			background: var(--surface1);
			border: 1px solid var(--surface2);
			color: var(--text);
			padding: 8px 16px;
			border-radius: 6px;
			cursor: pointer;
			font-size: 0.9rem;
		}
		
		.refresh-btn:hover {
			background: var(--surface2);
		}
		
		.stats-partial {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
			gap: 16px;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<div>
				<h1>Mulprox Dashboard</h1>
				<p class="subtitle">Proxy health and performance</p>
			</div>
			<button class="refresh-btn" hx-get="/dashboard/stats" hx-trigger="click" hx-target="#stats-grid">
				Refresh
			</button>
		</div>

		<div id="stats-grid" hx-get="/dashboard/stats" hx-trigger="load" hx-swap="innerHTML">
			<div class="loading">Loading stats...</div>
		</div>

		<h2>All Proxies</h2>
		<input 
			type="text" 
			class="search-box" 
			placeholder="Search by hostname, country, city, IP..." 
			name="q"
			hx-get="/dashboard/proxies"
			hx-trigger="input changed delay:300ms"
			hx-target="#proxies-table"
			hx-vals='{"q": ""}'
			oninput="this.setAttribute('hx-vals', JSON.stringify({q: this.value}))"
		>
		
		<div id="proxies-table" hx-get="/dashboard/proxies" hx-trigger="load" hx-swap="innerHTML">
			<div class="loading">Loading proxies...</div>
		</div>
	</div>

	<script>
		let sortState = { field: 'hostname', dir: 'asc' };
		
		function refreshProxies() {
			const table = document.getElementById('proxies-table');
			const searchBox = document.querySelector('.search-box');
			const query = searchBox ? searchBox.value : '';
			
			const params = new URLSearchParams();
			if (query) params.set('q', query);
			if (sortState.field) {
				params.set('sort', sortState.field);
				params.set('dir', sortState.dir);
			}
			
			const url = '/dashboard/proxies?' + params.toString();
			fetch(url).then(r => r.text()).then(html => {
				table.innerHTML = html;
			});
		}
		
		function refreshStats() {
			const stats = document.getElementById('stats-grid');
			fetch('/dashboard/stats').then(r => r.text()).then(html => {
				stats.innerHTML = html;
			});
		}
		
		setInterval(refreshStats, 1000);
		setInterval(refreshProxies, 1000);
		
		document.body.addEventListener('click', function(e) {
			const link = e.target.closest('.sort-link');
			if (link) {
				e.preventDefault();
				const sortField = link.dataset.sort;
				
				if (sortState.field === sortField) {
					sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
				} else {
					sortState.field = sortField;
					sortState.dir = 'desc';
				}
				
				refreshProxies();
			}
		});

		const searchBox = document.querySelector('.search-box');
		if (searchBox) {
			let debounceTimer;
			searchBox.addEventListener('input', function(e) {
				clearTimeout(debounceTimer);
				debounceTimer = setTimeout(refreshProxies, 300);
			});
		}
	</script>
</body>
</html>
