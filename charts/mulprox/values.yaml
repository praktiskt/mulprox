image:
  repository: praktiskt/mulprox
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  labels: {}
  tls: []
  # - hosts:
  #   - my-host
  #   secretName: my-tls-secret

env:
  - name: FAST_HEALTH_CHECK
    value: "true"
# - name: HTTP_PROXY
#   value: "http://proxy:8080"
# - name: MY_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password
# - name: HTTP_PROXY
#   value: "http://proxy:8080"
# - name: MY_SECRET
#   valueFrom:
#     secretKeyRef:
#       name: my-secret
#       key: password

proxyService:
  enabled: true

health:
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    # Allow up to 5 minutes (30 x 10s) for the first active proxy
    # to be discovered before marking the pod unhealthy.
    failureThreshold: 30

affinity: {}
dnsConfig:
  nameservers:
    - 1.1.1.1
    - 8.8.8.8
  searches:
    - default.svc.cluster.local
    - svc.cluster.local
    - cluster.local
  options:
    - name: ndots
      value: "2"
