apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http-proxy
    {{- if .Values.socks5.enabled }}
    - port: {{ .Values.socks5.port }}
      targetPort: {{ .Values.socks5.port }}
      protocol: TCP
      name: socks5
    {{- end }}
  selector:
    app: {{ .Release.Name }}
